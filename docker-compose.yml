services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-taskforge}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-taskforge}
    ports:
      - "5433:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-taskforge} -d ${DATABASE_NAME:-taskforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: .
      target: builder
    command: npm run dev:api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${DATABASE_USER:-taskforge}:${DATABASE_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-taskforge}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - RABBITMQ_QUEUE=taskforge.queue.jobs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  worker:
    build: 
      context: .
      target: builder
    restart: always
    command: npm run dev:worker
    environment:
      - DATABASE_URL=postgres://${DATABASE_USER:-taskforge}:${DATABASE_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-taskforge}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - RABBITMQ_QUEUE=taskforge.queue.jobs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  scheduler:
    build: 
      context: .
      target: builder
    restart: always
    command: npm run dev:scheduler
    environment:
      - DATABASE_URL=postgres://${DATABASE_USER:-taskforge}:${DATABASE_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-taskforge}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - RABBITMQ_QUEUE=taskforge.queue.jobs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  db-migrate:
    build: 
      context: .
      target: builder
    command: npm run db:migrate
    environment:
      - DATABASE_URL=postgres://${DATABASE_USER:-taskforge}:${DATABASE_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-taskforge}
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: taskforge_network

volumes:
  pgdata:
