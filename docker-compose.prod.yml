services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taskforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: node dist/packages/api/src/index.js
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: always
    command: node dist/packages/worker/src/index.js
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    command: node dist/packages/worker/src/scheduler.js
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  db-migrate:
    build: .
    command: npm run db:migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}

networks:
  default:
    name: taskforge_network

volumes:
  pgdata:
